<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Chess Arena</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1c1c22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      :root {
        --panel: rgba(18, 20, 28, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --accent: #f0c060;
        --text: #f3efe6;
        --muted: #a9a59c;
        --good: #6fd08c;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0d14;
        color: var(--text);
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        user-select: none;
      }
      canvas { display: block; }
      .hidden { display: none !important; }

      /* ===== 메뉴 ===== */
      #menu {
        position: fixed; inset: 0; z-index: 30;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(40, 30, 60, 0.75), rgba(0, 0, 0, 0.92));
        overflow-y: auto; padding: 16px;
      }
      .menu-card {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
      }
      .menu-card h1 {
        margin: 0 0 4px; font-size: 2.4rem; text-align: center; letter-spacing: 2px;
        background: linear-gradient(90deg, #ffe29a, #f0a050);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .subtitle { text-align: center; color: var(--muted); margin-bottom: 18px; font-size: 0.9rem; }
      .opt-row { margin: 12px 0; }
      .opt-row label.title { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
      .seg { display: flex; flex-wrap: wrap; gap: 6px; }
      .seg button {
        flex: 1 1 auto; min-width: 70px;
        background: rgba(255, 255, 255, 0.06); color: var(--text);
        border: 1px solid var(--line); border-radius: 9px;
        padding: 9px 10px; cursor: pointer; font-size: 0.92rem; transition: all 0.15s;
      }
      .seg button:hover { background: rgba(255, 255, 255, 0.12); }
      .seg button.on { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 700; }
      .start-btn {
        width: 100%; margin-top: 18px; padding: 14px; font-size: 1.2rem; font-weight: 700;
        border: none; border-radius: 12px; cursor: pointer; color: #1a1408;
        background: linear-gradient(90deg, #ffd36e, #f39a3d);
        box-shadow: 0 6px 20px rgba(243, 154, 61, 0.35);
      }
      .start-btn:hover { filter: brightness(1.08); }
      .record { margin-top: 14px; text-align: center; font-size: 0.85rem; color: var(--muted); }

      /* ===== HUD ===== */
      .side {
        position: fixed; top: 16px; bottom: 16px; width: 250px; z-index: 5;
        display: flex; flex-direction: column; gap: 12px; pointer-events: none;
      }
      .side > * { pointer-events: auto; }
      #left { left: 16px; justify-content: space-between; }
      #right { right: 16px; }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        padding: 12px 14px; backdrop-filter: blur(6px);
        transition: box-shadow 0.25s, border-color 0.25s;
      }
      .player.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(240, 192, 96, 0.35), 0 0 24px rgba(240, 192, 96, 0.25); }
      .p-head { display: flex; align-items: center; gap: 8px; }
      .p-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #888; }
      .p-name { font-weight: 700; flex: 1; }
      .p-score { font-size: 0.85rem; color: var(--good); font-weight: 700; }
      .clock {
        margin-top: 8px; font-family: Consolas, monospace; font-size: 2rem; text-align: center;
        background: rgba(0, 0, 0, 0.35); border-radius: 8px; padding: 4px 0;
      }
      .clock.low { color: var(--bad); animation: pulse 0.8s infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      .caps { margin-top: 8px; min-height: 30px; font-size: 1.45rem; line-height: 1.1; word-break: break-all; }
      .caps-label { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
      .status-mid { text-align: center; font-size: 0.95rem; }
      #thinking { color: var(--accent); font-size: 0.85rem; margin-top: 4px; }

      #moves-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #moves-card h3, .card h3 { margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
      #moves {
        flex: 1; overflow-y: auto; font-family: Consolas, monospace; font-size: 0.92rem;
        display: grid; grid-template-columns: 34px 1fr 1fr; row-gap: 2px; align-content: start;
      }
      #moves .n { color: var(--muted); }
      #moves .last { color: var(--accent); font-weight: 700; }
      .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .btns button {
        background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--line);
        border-radius: 9px; padding: 9px 6px; cursor: pointer; font-size: 0.88rem;
      }
      .btns button:hover { background: rgba(255, 255, 255, 0.16); }
      .btns button:disabled { opacity: 0.4; cursor: default; }

      /* ===== 토스트 / 모달 ===== */
      #toast {
        position: fixed; top: 18%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
        font-size: 2.6rem; font-weight: 800; z-index: 20; pointer-events: none; opacity: 0;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); transition: opacity 0.25s, transform 0.25s;
        white-space: nowrap;
      }
      #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .modal {
        position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.55); padding: 16px;
      }
      .modal .card { text-align: center; padding: 22px 26px; max-width: 420px; width: 100%; }
      .promo-opts { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
      .promo-opts button {
        font-size: 2.6rem; width: 72px; height: 72px; border-radius: 12px; cursor: pointer;
        background: rgba(255, 255, 255, 0.1); color: var(--text); border: 1px solid var(--line);
      }
      .promo-opts button:hover { background: var(--accent); color: #1a1408; }
      #over-title { font-size: 2rem; margin: 0 0 6px; }
      #over-reason { color: var(--muted); margin-bottom: 14px; }
      #over-stats { font-size: 0.9rem; margin-bottom: 16px; line-height: 1.6; }

      @media (max-width: 900px) {
        .side { width: 190px; }
        .clock { font-size: 1.5rem; }
        .caps { font-size: 1.1rem; }
      }
      @media (max-width: 640px) {
        #right { top: auto; height: auto; width: calc(100% - 32px); }
        #moves-card { display: none; }
        #left { width: 150px; }
        .btns { grid-template-columns: repeat(4, 1fr); }
      }
    </style>
  </head>
  <body>
    <!-- 시작 메뉴 -->
    <div id="menu">
      <div class="menu-card">
        <h1>♞ 3D CHESS ARENA</h1>
        <div class="subtitle">국제 규칙 · 캐슬링 · 앙파상 · 프로모션 · 무승부 규칙 지원</div>

        <div class="opt-row">
          <label class="title">게임 모드</label>
          <div class="seg" data-opt="mode">
            <button data-v="ai" class="on">1인 (vs 컴퓨터)</button>
            <button data-v="pvp">2인 (로컬)</button>
          </div>
        </div>
        <div class="opt-row" id="row-diff">
          <label class="title">컴퓨터 난이도</label>
          <div class="seg" data-opt="diff">
            <button data-v="1">쉬움</button>
            <button data-v="2" class="on">보통</button>
            <button data-v="3">어려움</button>
          </div>
        </div>
        <div class="opt-row" id="row-color">
          <label class="title">내 말 색 선택</label>
          <div class="seg" data-opt="color">
            <button data-v="w" class="on">♔ 백 (선공)</button>
            <button data-v="b">♚ 흑 (후공)</button>
            <button data-v="r">🎲 랜덤</button>
          </div>
        </div>
        <div class="opt-row">
          <label class="title">말 / 보드 테마</label>
          <div class="seg" data-opt="theme">
            <button data-v="classic" class="on">클래식 원목</button>
            <button data-v="royal">로열 골드</button>
            <button data-v="neon">네온</button>
            <button data-v="marble">대리석</button>
          </div>
        </div>
        <div class="opt-row">
          <label class="title">제한 시간 (1인당)</label>
          <div class="seg" data-opt="time">
            <button data-v="0">무제한</button>
            <button data-v="1">1분</button>
            <button data-v="3">3분</button>
            <button data-v="5">5분</button>
            <button data-v="10" class="on">10분</button>
            <button data-v="30">30분</button>
          </div>
        </div>
        <div class="opt-row">
          <label class="title">수당 추가 시간 (피셔)</label>
          <div class="seg" data-opt="inc">
            <button data-v="0" class="on">+0초</button>
            <button data-v="2">+2초</button>
            <button data-v="5">+5초</button>
            <button data-v="10">+10초</button>
          </div>
        </div>
        <div class="opt-row" id="row-rotate">
          <label class="title">2인 플레이 시 카메라 자동 회전</label>
          <div class="seg" data-opt="rotate">
            <button data-v="1" class="on">켜기</button>
            <button data-v="0">끄기</button>
          </div>
        </div>
        <button class="start-btn" id="start-btn">게임 시작</button>
        <div class="record" id="record"></div>
      </div>
    </div>

    <!-- HUD 왼쪽: 플레이어 -->
    <div class="side hidden" id="left">
      <div class="card player" id="card-top">
        <div class="p-head"><span class="p-dot"></span><span class="p-name"></span><span class="p-score"></span></div>
        <div class="clock">--:--</div>
        <div class="caps-label">잡은 말</div>
        <div class="caps"></div>
      </div>
      <div class="card status-mid">
        <div id="status">백 차례</div>
        <div id="thinking" class="hidden">🤔 컴퓨터가 생각 중...</div>
      </div>
      <div class="card player" id="card-bottom">
        <div class="p-head"><span class="p-dot"></span><span class="p-name"></span><span class="p-score"></span></div>
        <div class="clock">--:--</div>
        <div class="caps-label">잡은 말</div>
        <div class="caps"></div>
      </div>
    </div>

    <!-- HUD 오른쪽: 기보 + 버튼 -->
    <div class="side hidden" id="right">
      <div class="card" id="moves-card">
        <h3>기보</h3>
        <div id="moves"></div>
      </div>
      <div class="card">
        <div class="btns">
          <button id="btn-undo">↶ 무르기</button>
          <button id="btn-hint">💡 힌트</button>
          <button id="btn-flip">🔄 시점</button>
          <button id="btn-sound">🔊 소리</button>
          <button id="btn-resign">🏳 기권</button>
          <button id="btn-menu">☰ 메뉴</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <!-- 프로모션 선택 -->
    <div class="modal hidden" id="promo-modal">
      <div class="card">
        <h3 style="margin: 0">폰 승진! 바꿀 말을 고르세요</h3>
        <div class="promo-opts" id="promo-opts"></div>
      </div>
    </div>

    <!-- 게임 종료 -->
    <div class="modal hidden" id="over-modal">
      <div class="card">
        <h2 id="over-title"></h2>
        <div id="over-reason"></div>
        <div id="over-stats"></div>
        <div class="btns">
          <button id="btn-again">다시 하기</button>
          <button id="btn-tomenu">메뉴로</button>
          <button id="btn-review" style="grid-column: span 2">보드 살펴보기</button>
        </div>
      </div>
    </div>

    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
    <script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");</script>
  </body>
</html>
